name: keepalive
on:
  schedule: [{cron: "17 5 */3 * *"}]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          u=$(grep -o 'https://[A-Za-z0-9.-]*supabase.co' config.js | head -1)
          k=$(grep -oE '(eyJ|sb_publishable_)[A-Za-z0-9._-]+' config.js | head -1)
          curl -fsS "$u/rest/v1/settings?select=user_id&limit=1" -H "apikey: $k" -H "Authorization: Bearer $k"
